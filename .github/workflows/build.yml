name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (Spring Boot / JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven 打包
        run: mvn -B -f singleton/pom.xml clean package -DskipTests

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: singleton/application/target/*.jar
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: 前端 (Vue 3 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: 安装依赖
        working-directory: vue
        run: npm ci

      - name: 构建（含 vue-tsc 类型检查）
        working-directory: vue
        run: npm run build

      - name: 打包 dist
        run: tar czf dist.tar.gz -C vue dist

      - name: 上传 dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布（打 tag 时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release

      - name: 创建 Release 并附带产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls release/*.jar | head -1)
          cp "$JAR" "release/app.jar"
          gh release create "${GITHUB_REF_NAME}" \
            release/app.jar \
            release/dist.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "自动构建产物：app.jar（后端）+ dist.tar.gz（前端）。" \
            --repo "${GITHUB_REPOSITORY}"
